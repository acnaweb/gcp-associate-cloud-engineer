name: Render gcloud PlantUML

on:
  push:
    paths:
      - 'gcloud/**/*.puml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    name: plantuml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Render PlantUML diagrams
        id: plantuml
        uses: grassedge/generate-plantuml-action@v1.5
        with:
          path: gcloud
          message: "docs: render gcloud PlantUML diagrams"
        env:
          GITHUB_TOKEN: ${{ secrets.PLANTUML_GITHUB_TOKEN }}
